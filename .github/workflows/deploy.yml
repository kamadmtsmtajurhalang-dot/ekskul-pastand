name: Deploy to PythonAnywhere

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger PythonAnywhere WebApp Reload
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PA_USER: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PA_DOMAIN: ${{ secrets.PYTHONANYWHERE_DOMAIN }}
        run: |
          if [ -z "$PA_TOKEN" ] || [ -z "$PA_USER" ]; then
            echo "Secrets PYTHONANYWHERE_API_TOKEN atau PYTHONANYWHERE_USERNAME belum disetel di GitHub Secrets."
            echo "Silakan tambahkan di Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          
          DOMAIN="${PA_DOMAIN:-${PA_USER}.pythonanywhere.com}"
          echo "Mengirim sinyal reload ke: https://www.pythonanywhere.com/api/v0/user/${PA_USER}/webapps/${DOMAIN}/reload/"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Token ${PA_TOKEN}" \
            "https://www.pythonanywhere.com/api/v0/user/${PA_USER}/webapps/${DOMAIN}/reload/")
          
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "Response Status: $HTTP_STATUS"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ]; then
            echo "✅ Deploy & Reload PythonAnywhere Berhasil!"
          else
            echo "⚠️ Gagal reload (Status: $HTTP_STATUS). Cek kembali token dan nama domain."
            exit 1
          fi
